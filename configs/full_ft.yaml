experiment_id: E3
name: Full Fine-tuning
method: full_ft
purpose: 全参数性能基准，更新 ResNet18 骨干和分类头的全部参数。
data:
  dataset: CIFAR-10
  root: data
  train_per_class: 100
  test_per_class: 100
  train_fraction: 1.0
  image_size: 128
  download: false
  num_workers: 0
model:
  backbone: resnet18_imagenet
training:
  epochs: 15
  batch_size: 128
  lr_head: 0.002
  lr_full: 0.00005
  weight_decay: 0.0001
  seeds: [2026, 2027]
