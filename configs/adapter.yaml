experiment_id: X2
name: Adapter
method: adapter
purpose: 保留扩展实验，在 ResNet18 输出特征后添加瓶颈适配器并进行残差修正。
data:
  dataset: CIFAR-10
  root: data
  train_per_class: 100
  test_per_class: 100
  train_fraction: 1.0
  image_size: 128
  download: false
  num_workers: 0
model:
  backbone: resnet18_imagenet
  adapter_dim: 64
training:
  epochs: 4
  batch_size: 128
  lr_head: 0.002
  lr_full: 0.00005
  weight_decay: 0.0001
  seeds: [2026, 2027]
