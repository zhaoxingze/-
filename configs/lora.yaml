experiment_id: X1
name: LoRA
method: lora
purpose: 保留扩展实验，在分类头上使用低秩增量矩阵，作为简化 LoRA 的局限性分析对象。
data:
  dataset: CIFAR-10
  root: data
  train_per_class: 100
  test_per_class: 100
  train_fraction: 1.0
  image_size: 128
  download: false
  num_workers: 0
model:
  backbone: resnet18_imagenet
  lora_rank: 8
training:
  epochs: 15
  batch_size: 128
  lr_head: 0.002
  lr_full: 0.00005
  weight_decay: 0.0001
  seeds: [2026, 2027]
