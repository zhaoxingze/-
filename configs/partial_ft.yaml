experiment_id: E2
name: Partial Fine-tuning
method: partial_ft
purpose: 局部解冻基准，解冻 ResNet18 的 layer4 和分类头。
data:
  dataset: CIFAR-10
  root: data
  train_per_class: 100
  test_per_class: 100
  train_fraction: 1.0
  image_size: 128
  download: false
  num_workers: 0
model:
  backbone: resnet18_imagenet
  unfrozen_layers: [layer4, classifier]
training:
  epochs: 4
  batch_size: 128
  lr_head: 0.002
  lr_full: 0.00005
  weight_decay: 0.0001
  seeds: [2026, 2027]
